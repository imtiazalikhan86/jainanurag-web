<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1f3a" />

    <title>Jainanurag &amp; Associates | Chartered Accountants in Mumbai</title>
    <meta
      name="description"
      content="Chartered Accountants in Mumbai helping Indian and international businesses with business setup, GST registration, taxation, accounting, compliance and advisory in India."
    />
    <link rel="canonical" href="https://www.jainanurag.example/" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / social -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:site_name" content="Jainanurag & Associates" />
    <meta property="og:title" content="Jainanurag &amp; Associates | Chartered Accountants in Mumbai" />
    <meta
      property="og:description"
      content="Business setup, GST, taxation, accounting and compliance support for businesses starting, operating and growing in India."
    />
    <meta property="og:url" content="https://www.jainanurag.example/" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Fonts: preconnect first, then one stylesheet with only the weights in use. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
    />

    <!--
      Structured data. Only facts the firm has confirmed appear here: no ratings, review
      counts or founding dates until the client supplies them.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "AccountingService",
        "name": "Jainanurag & Associates",
        "description": "Chartered Accountants in Mumbai providing business setup, GST, taxation, accounting, compliance and advisory services for Indian and international businesses.",
        "url": "https://www.jainanurag.example/",
        "areaServed": "IN",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Mumbai",
          "addressRegion": "Maharashtra",
          "addressCountry": "IN"
        },
        "knowsAbout": [
          "Business setup in India",
          "GST registration and returns",
          "Income tax and corporate taxation",
          "Accounting and bookkeeping",
          "Statutory compliance",
          "India market entry"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
